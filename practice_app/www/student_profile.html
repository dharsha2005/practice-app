{% extends "templates/web.html" %}

{% block page_content %}
<div class="container mt-5">

    <div class="card p-4 shadow-sm" style="max-width: 600px; margin: auto;">

        <h2 class="mb-4">Edit Student Profile</h2>

        <div class="mb-3">
            <label>Student Name</label>
            <input type="text" id="student_name" class="form-control">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" id="email" class="form-control">
        </div>

        <div class="mb-3">
            <label>Phone</label>
            <input type="text" id="phone" class="form-control">
        </div>

        <div class="mb-3">
            <label>Course</label>
            <input type="text" id="course" class="form-control">
        </div>

        <div class="mb-3">
            <label>Address</label>
            <textarea id="address" class="form-control"></textarea>
        </div>

        <button class="btn btn-primary" onclick="updateStudent()">
            Update Profile
        </button>

    </div>

</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const student_id = urlParams.get('student_id') || urlParams.get('name') || "{{ frappe.form_dict.get('student_id') or frappe.form_dict.get('name') or '' }}";

    if (student_id) {
        frappe.call({
            method: 'practice_app.www.student_profile.get_student',
            args: {
                student_id: student_id
            },
            callback: function (r) {
                if (r.message) {
                    document.getElementById('student_name').value = r.message.student_name || '';
                    document.getElementById('email').value = r.message.email || '';
                    document.getElementById('phone').value = r.message.phone_number || r.message.phone || '';
                    document.getElementById('course').value = r.message.department || r.message.course || '';
                    document.getElementById('address').value = r.message.address || '';
                }
            }
        });
    }

    function updateStudent() {
        if (!student_id) {
            frappe.msgprint("Student ID is missing from URL.");
            return;
        }
        frappe.call({
            method: 'practice_app.www.student_profile.update_student',
            args: {
                student_id: student_id,
                student_name: document.getElementById('student_name').value,
                email: document.getElementById('email').value,
                phone_number: document.getElementById('phone').value,
                department: document.getElementById('course').value,
                address: document.getElementById('address').value
            },
            callback: function (r) {
                if (r.message && r.message.success) {
                    frappe.msgprint(r.message.message);
                }
            }
        });
    }
</script>
{% endblock %}
