<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ title }}</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="/assets/practice_app/css/student_portal.css">
	<style>
		.login-wrapper {
			min-height: calc(100vh - 75px - 100px);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 3rem 1rem;
		}
		.login-card {
			width: 100%;
			max-width: 440px;
			padding: 2.5rem;
		}
	</style>
</head>
<body>

	{% include "templates/includes/navbar.html" %}

	<div class="login-wrapper">
		<div class="glass-card login-card animate-fade-in">
			<div class="text-center mb-4">
				<div class="bg-primary text-white rounded-3 p-3 d-inline-flex align-items-center justify-content-center mb-3" style="width: 55px; height: 55px;">
					<i class="bi bi-mortarboard-fill fs-3"></i>
				</div>
				<h3 class="fw-bold mb-1">Portal Login</h3>
				<p class="text-muted small">Access your Student & Staff Academic Dashboard</p>
			</div>

			<form id="portal-login-form">
				<div class="mb-3">
					<label class="form-label fw-semibold text-muted small">Email Address / User ID</label>
					<div class="input-group">
						<span class="input-group-text bg-transparent border-end-0"><i class="bi bi-envelope text-primary"></i></span>
						<input type="text" name="usr" id="login-email" class="form-control border-start-0 py-2" required placeholder="student@example.com" autocomplete="username">
					</div>
				</div>

				<div class="mb-4">
					<div class="d-flex justify-content-between align-items-center mb-1">
						<label class="form-label fw-semibold text-muted small mb-0">Password</label>
					</div>
					<div class="input-group">
						<span class="input-group-text bg-transparent border-end-0"><i class="bi bi-lock text-primary"></i></span>
						<input type="password" name="pwd" id="login-password" class="form-control border-start-0 py-2" required placeholder="••••••••" autocomplete="current-password">
						<button class="btn btn-outline-secondary border-start-0" type="button" id="toggle-password-btn"><i class="bi bi-eye"></i></button>
					</div>
				</div>

				<div id="login-alert" class="alert d-none py-2 px-3 mb-3 small"></div>

				<button type="submit" id="login-submit-btn" class="btn btn-primary-gradient w-100 py-2.5 fw-semibold mb-3">
					Sign In <i class="bi bi-box-arrow-in-right ms-1"></i>
				</button>
			</form>

			<div class="text-center border-top pt-3 text-muted small">
				New Student Admissions? <a href="/contact" class="text-primary fw-semibold text-decoration-none">Enquire Here</a>
			</div>
		</div>
	</div>

	{% include "templates/includes/footer.html" %}

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		document.addEventListener("DOMContentLoaded", function () {
			const loginForm = document.getElementById("portal-login-form");
			const submitBtn = document.getElementById("login-submit-btn");
			const alertBox = document.getElementById("login-alert");
			const togglePasswordBtn = document.getElementById("toggle-password-btn");
			const passwordInput = document.getElementById("login-password");

			if (togglePasswordBtn && passwordInput) {
				togglePasswordBtn.addEventListener("click", function () {
					const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
					passwordInput.setAttribute("type", type);
					togglePasswordBtn.querySelector("i").className = type === "password" ? "bi bi-eye" : "bi bi-eye-slash";
				});
			}

			if (loginForm) {
				loginForm.addEventListener("submit", function (e) {
					e.preventDefault();
					
					submitBtn.disabled = true;
					submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';
					alertBox.className = "alert d-none py-2 px-3 mb-3 small";

					const formData = new FormData(loginForm);
					formData.append("cmd", "login");

					fetch("/api/method/login", {
						method: "POST",
						body: formData,
						headers: {
							"Accept": "application/json"
						}
					})
					.then(response => {
						if (!response.ok) {
							throw new Error("Invalid credentials");
						}
						return response.json();
					})
					.then(data => {
						if (data.message === "Logged In" || data.home_page) {
							alertBox.className = "alert alert-success py-2 px-3 mb-3 small d-block";
							alertBox.textContent = "Success! Redirecting...";
							window.location.href = data.home_page || "/app";
						} else {
							throw new Error("Authentication failed");
						}
					})
					.catch(error => {
						submitBtn.disabled = false;
						submitBtn.innerHTML = 'Sign In <i class="bi bi-box-arrow-in-right ms-1"></i>';
						alertBox.className = "alert alert-danger py-2 px-3 mb-3 small d-block";
						alertBox.textContent = "Invalid username or password. Please try again.";
					});
				});
			}
		});
	</script>
</body>
</html>
