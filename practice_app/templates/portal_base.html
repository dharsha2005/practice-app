<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ title or "Student Portal | TIT Institute of Technology" }}</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="/assets/practice_app/css/student_portal.css">
	<script>
		(function() {
			var theme = localStorage.getItem("portalTheme");
			if (theme === "dark") {
				document.documentElement.setAttribute("data-theme", "dark");
			}
		})();
	</script>
	<style>
		[data-theme="dark"] body, [data-theme="dark"] .portal-content-wrapper {
			background-color: #0f172a !important;
			color: #f8fafc !important;
		}
		[data-theme="dark"] .bg-white, [data-theme="dark"] .academic-card, [data-theme="dark"] header.bg-white {
			background-color: #1e293b !important;
			color: #f8fafc !important;
			border-color: #334155 !important;
		}
		[data-theme="dark"] .text-dark, [data-theme="dark"] h1, [data-theme="dark"] h2, [data-theme="dark"] h3, [data-theme="dark"] h4, [data-theme="dark"] h5, [data-theme="dark"] h6 {
			color: #f8fafc !important;
		}
		[data-theme="dark"] .text-muted {
			color: #94a3b8 !important;
		}
		[data-theme="dark"] .table {
			color: #f8fafc !important;
			--bs-table-bg: transparent;
			border-color: #334155 !important;
		}
		[data-theme="dark"] .table-light, [data-theme="dark"] .bg-light {
			background-color: #334155 !important;
			color: #f8fafc !important;
			border-color: #475569 !important;
		}
		[data-theme="dark"] .form-control, [data-theme="dark"] .form-select {
			background-color: #334155 !important;
			color: #f8fafc !important;
			border-color: #475569 !important;
		}
		[data-theme="dark"] .modal-content {
			background-color: #1e293b !important;
			color: #f8fafc !important;
		}
	</style>
	{% block head %}{% endblock %}
</head>
<body class="bg-light">
	{% block content %}{% endblock %}
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		function portalLogout() {
			fetch('/api/method/logout', { method: 'POST' })
			.finally(function() {
				window.location.href = '/login';
			});
			return false;
		}
	</script>
	{% block script %}{% endblock %}
</body>
</html>
