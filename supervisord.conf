[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=/home/frappe/frappe-bench/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:frappe-web]
command=/home/frappe/frappe-bench/env/bin/gunicorn --chdir=/home/frappe/frappe-bench/sites --bind=0.0.0.0:%(ENV_PORT)s --threads=4 --workers=2 --timeout=120 "frappe.app:application_with_statics()"
autostart=true
autorestart=true
priority=10
stderr_logfile=/home/frappe/frappe-bench/logs/web.error.log
stdout_logfile=/home/frappe/frappe-bench/logs/web.out.log
user=frappe

[program:frappe-schedule]
command=/home/frappe/.local/bin/bench --site all schedule
autostart=%(ENV_ENABLE_WORKERS)s
autorestart=true
startsecs=2
startretries=5
priority=20
user=frappe
stdout_logfile=/home/frappe/frappe-bench/logs/schedule.log
stderr_logfile=/home/frappe/frappe-bench/logs/schedule.error.log

[program:frappe-default-worker]
command=/home/frappe/.local/bin/bench --site all worker --queue default
autostart=%(ENV_ENABLE_WORKERS)s
autorestart=true
startsecs=2
startretries=5
priority=20
user=frappe
stdout_logfile=/home/frappe/frappe-bench/logs/worker-default.log
stderr_logfile=/home/frappe/frappe-bench/logs/worker-default.error.log
